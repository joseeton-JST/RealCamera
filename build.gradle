import java.io.IOException

plugins {
    // Use a released Architectury Plugin to avoid snapshot resolution failures in new environments.
    id "architectury-plugin" version "3.4.162"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
        accessWidenerPath = project(":common").file("src/main/resources/realcamera.accesswidener")
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        //mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }

    version = rootProject.mod_version + (findProperty("commitSHA") ? "-${(commitSHA as String).substring(0,7)}" : "")
    group = rootProject.maven_group

    repositories {
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.terraformersmc.com/releases/" }
        maven { url "https://api.modrinth.com/maven" }
        //maven { url "https://cursemaven.com" }
        //maven { url "https://www.jitpack.io" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    tasks.withType(JavaExec).configureEach { task ->
        if (task.name.toLowerCase().contains("runclient")) {
            Process xvfbProcess = null
            task.doFirst {
                if (!System.getenv().containsKey("DISPLAY")) {
                    try {
                        xvfbProcess = new ProcessBuilder("Xvfb", ":99", "-screen", "0", "1024x768x24")
                                .inheritIO()
                                .start()
                        task.jvmArgs "-Djava.awt.headless=true", "-Drealcamera.autoExitAfterLaunch=true", "-Dcom.mojang.text2speech.disable=true"
                        task.environment("DISPLAY", ":99")
                        task.environment("LIBGL_ALWAYS_SOFTWARE", "1")
                        task.environment("__GL_SYNC_TO_VBLANK", "0")
                    } catch (IOException ex) {
                        throw new GradleException("Failed to start Xvfb for ${task.path}", ex)
                    }
                }
            }

            task.doLast {
                if (xvfbProcess?.isAlive()) {
                    xvfbProcess.destroy()
                }
            }
        }
    }

    java {
        withSourcesJar()
    }
}
